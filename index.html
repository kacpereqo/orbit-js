<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolorowy Układ Słoneczny 3D</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div id="ui-panel">
        <h2 style="margin:0 0 10px 0; font-size: 18px;">Układ Słoneczny</h2>
        <div class="control-group">
            <label>Prędkość</label>
            <input type="range" id="speedRange" min="0" max="5" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>Jasność Słońca</label>
            <input type="range" id="lightRange" min="0" max="10" step="0.1" value="3">
        </div>
        <div class="control-group">
            <label>Skupienie kamery</label>
            <select id="planetSelect">
                <option value="default">Widok ogólny</option>
                <option value="Sun">Słońce</option>
                <option value="Mercury">Merkury</option>
                <option value="Venus">Wenus</option>
                <option value="Earth">Ziemia</option>
                <option value="Mars">Mars</option>
                <option value="Jupiter">Jowisz</option>
                <option value="Saturn">Saturn</option>
            </select>
        </div>
        <button id="orbitBtn">Pokaż/Ukryj Orbity</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.127.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.127.0/examples/js/controls/OrbitControls.js"></script>

    <script src="js/solar-system.js"></script>
    <script src="js/ui-controls.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
