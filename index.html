<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolorowy Układ Słoneczny 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background: #000;
        }

        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #444;
            max-width: 250px;
            z-index: 100;
        }

        .control-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 5px;
        }

        input[type="range"] {
            width: 100%;
        }

        select {
            width: 100%;
            padding: 5px;
            background: #222;
            color: white;
            border: 1px solid #444;
        }

        button {
            width: 100%;
            padding: 8px;
            cursor: pointer;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div id="ui-panel">
        <h2 style="margin:0 0 10px 0; font-size: 18px;">Układ Słoneczny</h2>
        <div class="control-group">
            <label>Prędkość</label>
            <input type="range" id="speedRange" min="0" max="5" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>Jasność Słońca</label>
            <input type="range" id="lightRange" min="0" max="10" step="0.1" value="3">
        </div>
        <div class="control-group">
            <label>Skupienie kamery</label>
            <select id="planetSelect">
                <option value="default">Widok ogólny</option>
                <option value="Sun">Słońce</option>
                <option value="Mercury">Merkury</option>
                <option value="Venus">Wenus</option>
                <option value="Earth">Ziemia</option>
                <option value="Mars">Mars</option>
                <option value="Jupiter">Jowisz</option>
                <option value="Saturn">Saturn</option>
            </select>
        </div>
        <button id="orbitBtn">Pokaż/Ukryj Orbity</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const planetData = [
            { name: "Mercury", radius: 0.8, dist: 18, speed: 0.04, color: 0xA5A5A5 },
            { name: "Venus", radius: 1.2, dist: 26, speed: 0.015, color: 0xFFD39B },
            { name: "Earth", radius: 1.3, dist: 35, speed: 0.01, color: 0x2255EE },
            { name: "Mars", radius: 1.0, dist: 45, speed: 0.008, color: 0xFF5733 },
            { name: "Jupiter", radius: 3.5, dist: 65, speed: 0.004, color: 0xD39C7E },
            { name: "Saturn", radius: 3.0, dist: 85, speed: 0.002, color: 0xE2BF73, rings: true }
        ];

        let scene, camera, renderer, controls, clock;
        let sun, pointLight, ambientLight;
        let planets = [];
        let simulationSpeed = 1;
        let focusedPlanet = null;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            clock = new THREE.Clock();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 100, 150);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.NoToneMapping;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Ambient — delikatne doświetlenie cienia (nie "zjada" koloru)
            ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
            scene.add(ambientLight);

            // Główne światło punktowe (Słońce)
            pointLight = new THREE.PointLight(0xffffff, 3, 1000);
            pointLight.decay = 0;
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);

            // Skybox
            const textureLoader = new THREE.TextureLoader();
            const skyGeo = new THREE.SphereGeometry(800, 32, 32);
            const skyMat = new THREE.MeshBasicMaterial({
                map: textureLoader.load('https://cdn.prod.website-files.com/63a20c382430f34e85b5c7c5/672e89809c94bd47388d43a9_Starry_Wallpaper_001.png'),
                side: THREE.BackSide
            });
            scene.add(new THREE.Mesh(skyGeo, skyMat));

            // Słońce — zawsze jasne, bez oświetlenia
            const sunGeo = new THREE.SphereGeometry(8, 64, 64);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xFFF4C2 });
            sun = new THREE.Mesh(sunGeo, sunMat);
            scene.add(sun);

            // Poświata wokół Słońca (sprite / additive halo)
            const haloGeo = new THREE.SphereGeometry(10.5, 32, 32);
            const haloMat = new THREE.MeshBasicMaterial({
                color: 0xFFDD44,
                transparent: true,
                opacity: 0.08,
                side: THREE.FrontSide,
                depthWrite: false
            });
            sun.add(new THREE.Mesh(haloGeo, haloMat));

            // Planety — MeshLambertMaterial: solid color + reaguje na światło
            planetData.forEach(data => {
                const pivot = new THREE.Object3D();
                scene.add(pivot);

                const planetGeo = new THREE.SphereGeometry(data.radius, 48, 48);

                // MeshLambertMaterial: jednorodny kolor, diffuse lighting, brak speculara
                const planetMat = new THREE.MeshLambertMaterial({
                    color: data.color
                });

                const mesh = new THREE.Mesh(planetGeo, planetMat);
                mesh.position.x = data.dist;
                pivot.add(mesh);

                // Orbita w kolorze planety
                const orbitGeo = new THREE.RingGeometry(data.dist - 0.15, data.dist + 0.15, 128);
                const orbitMat = new THREE.MeshBasicMaterial({
                    color: data.color,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.3
                });
                const orbitLine = new THREE.Mesh(orbitGeo, orbitMat);
                orbitLine.rotation.x = Math.PI / 2;
                scene.add(orbitLine);

                // Pierścienie Saturna
                if (data.rings) {
                    const ringGeo = new THREE.RingGeometry(data.radius * 1.5, data.radius * 2.5, 64);
                    const ringMat = new THREE.MeshBasicMaterial({
                        color: data.color,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.4
                    });
                    const rings = new THREE.Mesh(ringGeo, ringMat);
                    rings.rotation.x = Math.PI / 2.2;
                    mesh.add(rings);
                }

                planets.push({ mesh, pivot, data, orbitLine });
            });

            // UI
            document.getElementById('speedRange').oninput = (e) => simulationSpeed = e.target.value;
            document.getElementById('lightRange').oninput = (e) => pointLight.intensity = parseFloat(e.target.value);
            document.getElementById('planetSelect').onchange = (e) => focusOn(e.target.value);
            document.getElementById('orbitBtn').onclick = () => {
                planets.forEach(p => p.orbitLine.visible = !p.orbitLine.visible);
            };

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function focusOn(name) {
            if (name === 'default') { focusedPlanet = null; controls.target.set(0, 0, 0); }
            else if (name === 'Sun') { focusedPlanet = sun; }
            else {
                const p = planets.find(pl => pl.data.name === name);
                focusedPlanet = p.mesh;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            planets.forEach(p => {
                p.pivot.rotation.y += p.data.speed * simulationSpeed * 0.5;
                p.mesh.rotation.y += 0.01 * simulationSpeed;
            });
            sun.rotation.y += 0.001 * simulationSpeed;

            if (focusedPlanet) {
                const targetPos = new THREE.Vector3();
                focusedPlanet.getWorldPosition(targetPos);
                controls.target.lerp(targetPos, 0.1);
            }

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>

</html>
